
name: Automatically update Paddock stories

on:
  push:
    branches: [main]
    paths:
      - 'stories/**'
      - 'scripts/build_stories.py'
      - '.github/workflows/update-stories.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stories:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Generate story index
        run: python3 scripts/build_stories.py

      - name: Save updated story index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stories/index.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update Paddock stories"
            git push
          else
            echo "Paddock stories are already up to date."
          fi
